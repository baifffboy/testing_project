server:
  port: 8080

spring:
  application:
    name: client-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clients_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
