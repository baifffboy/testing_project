services:
  db:
    image: postgres:16
    container_name: clients-db
    environment:
      POSTGRES_DB: clients_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clients_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: clients-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/clients_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
